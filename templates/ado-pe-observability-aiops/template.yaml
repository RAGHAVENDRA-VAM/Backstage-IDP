apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: ado-pe-observability-aiops
  title: Unified Observability + AIOps Integration
  description: "Platform Engineer Life Cycle: Setup unified logging, tracing, and AIOps integrations."
  tags:
    - azure-devops
    - ado
    - platform
    - observability
    - aiops
spec:
  owner: user:guest
  type: service

  parameters:

    - title: Observability Setup
      required:
        - name
        - description
        - apmTool
      properties:
        name:
          title: Integration Name
          type: string
          ui:autofocus: true
        description:
          title: Description
          type: string
        apmTool:
          title: APM Platform
          type: string
          enum: ['Azure Application Insights', 'Datadog', 'Dynatrace', 'New Relic']
          default: 'Azure Application Insights'
        logRetention:
          title: Log Retention Days
          type: integer
          default: 30
    - title: Choose a location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - dev.azure.com

  steps:
    - id: fetch-base
      name: Fetch Base Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          repoUrl: ${{ parameters.repoUrl }}

    - id: publish
      name: Publish to Azure DevOps
      action: publish:azure
      input:
        description: This is ${{ parameters.name }}
        repoUrl: ${{ parameters.repoUrl }}

    - id: register
      name: Register in Backstage
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
