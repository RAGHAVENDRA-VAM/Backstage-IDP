name: Build, Security Scan and Deploy Backstage IDP to Azure Web App

on:
  push:
    branches:
      - main
      - Feature-01
  pull_request:
    branches:
      - main
      - Feature-01
  workflow_dispatch:

jobs:
  devsecops-gates:
    name: DevSecOps Quality & Security Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Gitleaks: Pre-commit Secret Scanning
      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # 2. Semgrep: Static Application Security Testing (SAST)
      - name: Run Semgrep SAST Scan
        run: |
          python3 -m pip install semgrep
          semgrep scan --config auto --exclude="templates" --exclude="scratch_build_test" --exclude="*.js" --error || true

      # 3. Trivy: Repository Filesystem & Dependency Vulnerability Scan
      - name: Run Trivy Vulnerability & Misconfiguration Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          skip-dirs: 'templates'
        continue-on-error: true

  build-and-deploy:
    name: Build & Deploy Backstage IDP
    needs: devsecops-gates
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'

      - name: Enable Corepack & Install Dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Build Backstage Production Bundles
        run: yarn build:backend

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/backstage-idp:${{ github.sha }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/backstage-idp:latest \
            -f packages/backend/Dockerfile .

      # 4. Trivy: Container Image Vulnerability Audit before pushing to registry
      - name: Run Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.ACR_LOGIN_SERVER }}/backstage-idp:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
        continue-on-error: true

      - name: Push Container Images to ACR
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/backstage-idp:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/backstage-idp:latest

      - name: Deploy to Azure Web App Container
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/backstage-idp:${{ github.sha }}
