apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: ado-dev-experimentation
  title: Experimentation With New Services
  description: "Developer Life Cycle: Spin up isolated sandbox environments for experimenting with new tech."
  tags:
    - azure-devops
    - ado
    - developer
    - sandbox
    - experimentation
spec:
  owner: user:guest
  type: service

  parameters:

    - title: Sandbox Parameters
      required:
        - name
        - description
        - ttlDays
      properties:
        name:
          title: Experiment Name
          type: string
          ui:autofocus: true
        description:
          title: Description
          type: string
        ttlDays:
          title: Time-to-Live (Days until auto-deletion)
          type: integer
          minimum: 1
          maximum: 30
          default: 7
        costCenter:
          title: Cost Center Code
          type: string
    - title: Choose a location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - dev.azure.com

  steps:
    - id: fetch-base
      name: Fetch Base Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          repoUrl: ${{ parameters.repoUrl }}

    - id: publish
      name: Publish to Azure DevOps
      action: publish:azure
      input:
        description: This is ${{ parameters.name }}
        repoUrl: ${{ parameters.repoUrl }}

    - id: register
      name: Register in Backstage
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
