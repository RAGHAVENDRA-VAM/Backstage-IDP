apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: ado-dev-health-insights
  title: Application Health Insights
  description: "Developer Life Cycle: Generate health monitoring dashboards and alerting configurations."
  tags:
    - azure-devops
    - ado
    - developer
    - monitoring
    - health
spec:
  owner: user:guest
  type: service

  parameters:

    - title: Health & Monitoring Config
      required:
        - name
        - description
        - sloTarget
      properties:
        name:
          title: Monitoring Dashboard Name
          type: string
          ui:autofocus: true
        description:
          title: Description
          type: string
        sloTarget:
          title: Service Level Objective (SLO)
          type: string
          enum: ['99.0%', '99.9%', '99.95%', '99.99%']
          default: '99.9%'
        alertChannel:
          title: Alert Notification Channel
          type: string
          enum: ['Microsoft Teams', 'Slack', 'Email Only']
          default: 'Microsoft Teams'
    - title: Choose a location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - dev.azure.com

  steps:
    - id: fetch-base
      name: Fetch Base Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          repoUrl: ${{ parameters.repoUrl }}

    - id: publish
      name: Publish to Azure DevOps
      action: publish:azure
      input:
        description: This is ${{ parameters.name }}
        repoUrl: ${{ parameters.repoUrl }}

    - id: register
      name: Register in Backstage
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
