apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: ado-dev-scm-activities
  title: Day-to-Day SCM Activities
  description: "Developer Life Cycle: Scaffold standard branching strategies, PR templates, and SCM automation."
  tags:
    - azure-devops
    - ado
    - developer
    - scm
    - git
spec:
  owner: user:guest
  type: service

  parameters:

    - title: SCM Configuration
      required:
        - name
        - description
        - branchingStrategy
      properties:
        name:
          title: Repository Name
          type: string
          ui:autofocus: true
        description:
          title: Description
          type: string
        branchingStrategy:
          title: Branching Strategy
          type: string
          enum: ['Trunk-Based Development', 'GitFlow', 'GitHub Flow']
          default: 'Trunk-Based Development'
        requireReviewers:
          title: Require PR Reviewers
          type: boolean
          default: true
        includePRTemplate:
          title: Include standard PR Template
          type: boolean
          default: true
    - title: Choose a location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - dev.azure.com

  steps:
    - id: fetch-base
      name: Fetch Base Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          repoUrl: ${{ parameters.repoUrl }}

    - id: publish
      name: Publish to Azure DevOps
      action: publish:azure
      input:
        description: This is ${{ parameters.name }}
        repoUrl: ${{ parameters.repoUrl }}

    - id: register
      name: Register in Backstage
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
