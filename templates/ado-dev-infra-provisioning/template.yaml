apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: ado-dev-infra-provisioning
  title: Application Specific Infra Provisioning
  description: "Developer Life Cycle: Self-service provisioning of application-specific infrastructure (databases, queues)."
  tags:
    - azure-devops
    - ado
    - developer
    - infrastructure
    - provisioning
spec:
  owner: user:guest
  type: other

  parameters:

    - title: Infrastructure Specifications
      required:
        - name
        - description
        - environment
        - dbType
      properties:
        name:
          title: Infrastructure Component Name
          type: string
          ui:autofocus: true
        description:
          title: Description
          type: string
        environment:
          title: Target Environment
          type: string
          enum: ['Development', 'QA', 'Staging', 'Production']
          default: 'Development'
        dbType:
          title: Database Type
          type: string
          enum: ['Azure SQL', 'CosmosDB', 'PostgreSQL Flexible Server', 'Redis Cache', 'None']
          default: 'None'
        computeSize:
          title: Compute Size
          type: string
          enum: ['Small', 'Medium', 'Large']
          default: 'Small'
    - title: Choose a location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - dev.azure.com

  steps:
    - id: fetch-base
      name: Fetch Base Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          repoUrl: ${{ parameters.repoUrl }}

    - id: publish
      name: Publish to Azure DevOps
      action: publish:azure
      input:
        description: This is ${{ parameters.name }}
        repoUrl: ${{ parameters.repoUrl }}

    - id: register
      name: Register in Backstage
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
