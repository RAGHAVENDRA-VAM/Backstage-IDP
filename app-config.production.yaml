app:
  # Should be the same as backend.baseUrl when using the `app-backend` plugin.
  baseUrl: ${APP_CONFIG_app_baseUrl}

backend:
  baseUrl: ${APP_CONFIG_backend_baseUrl}
  listen: ':7007'
  cors:
    origin: ${APP_CONFIG_app_baseUrl}
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE, OPTIONS]
    credentials: true

  # Default sqlite database for lightweight cloud demo / container hosting
  database:
    client: better-sqlite3
    connection: ':memory:'

auth:
  environment: production
  providers:
    guest: {}
    github:
      production:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            - resolver: enterpriseCustomResolver
          dangerouslyAllowSignInWithoutUserInCatalog: true

catalog:
  rules:
    - allow: [Component, System, API, Resource, Location, Template, Group, User]
  locations:
    - type: file
      target: ./examples/entities.yaml
    - type: file
      target: ./org-data.yaml
      rules:
        - allow: [Group, User]
    - type: file
      target: ./all-templates.yaml
      rules:
        - allow: [Template, Location]
    - type: file
      target: /app/examples/entities.yaml
    - type: file
      target: /app/org-data.yaml
      rules:
        - allow: [Group, User]
    - type: file
      target: /app/all-templates.yaml
      rules:
        - allow: [Template, Location]
