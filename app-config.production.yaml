app:
  title: Shield Insurance Developer Portal
  # Should be the same as backend.baseUrl when using the `app-backend` plugin.
  baseUrl: ${APP_CONFIG_app_baseUrl}
  extensions:
    - core:root-redirect:
        config:
          target: '/catalog'
    - page:catalog/entity:
        config:
          groups:
            - overview:
                title: Overview
            - '/jira':
                title: Jira
            - '/github-actions':
                title: GitHub Actions
            - '/pull-requests':
                title: Pull Requests
            - '/azure':
                title: Azure
            - '/datadog':
                title: Datadog
            - documentation:
                title: Docs
          defaultContentOrder: natural

organization:
  name: Shield Insurance


backend:
  baseUrl: ${APP_CONFIG_backend_baseUrl}
  listen: ':7007'
  cors:
    origin: ${APP_CONFIG_app_baseUrl}
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE, OPTIONS]
    credentials: true

  # Default sqlite database for lightweight cloud demo / container hosting
  database:
    client: better-sqlite3
    connection: ':memory:'

auth:
  environment: production
  providers:
    guest: {}
    github:
      production:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            - resolver: enterpriseCustomResolver
          dangerouslyAllowSignInWithoutUserInCatalog: true

catalog:
  rules:
    - allow: [Component, System, API, Resource, Location, Template, Group, User]
  locations:
    # 1. Local container files (guaranteed to exist inside container image at /app/)
    - type: file
      target: ./examples/entities.yaml
    - type: file
      target: ./org-data.yaml
      rules:
        - allow: [Group, User]
    - type: file
      target: ./all-templates.yaml
      rules:
        - allow: [Template, Location]
    - type: file
      target: /app/examples/entities.yaml
    - type: file
      target: /app/org-data.yaml
      rules:
        - allow: [Group, User]
    - type: file
      target: /app/all-templates.yaml
      rules:
        - allow: [Template, Location]
    # Direct individual template files
    - type: file
      target: ./templates/golden-path-webapp/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./templates/deploy-app-to-azure-webapp/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./templates/ado-work-item/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./templates/react-web-app/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./templates/node-express-microservice/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./templates/java-springboot-enterprise/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./templates/dotnet-webapi-enterprise/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./templates/enterprise-rag-application/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./templates/techdocs-onboarding/template.yaml
      rules:
        - allow: [Template]

    # 2. Direct GitHub URL locations (fallback)
    - type: url
      target: https://github.com/RAGHAVENDRA-VAM/Backstage-IDP/blob/main/examples/entities.yaml
    - type: url
      target: https://github.com/RAGHAVENDRA-VAM/Backstage-IDP/blob/main/org-data.yaml
      rules:
        - allow: [Group, User]
    - type: url
      target: https://github.com/RAGHAVENDRA-VAM/Backstage-IDP/blob/main/all-templates.yaml
