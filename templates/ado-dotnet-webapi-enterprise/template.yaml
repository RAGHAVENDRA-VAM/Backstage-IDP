apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: ado-dotnet-webapi-enterprise
  title: .NET Web API Enterprise Application (ADO)
  description: .NET Web API with tests, Dockerfile, azure-pipelines.yml.
  tags:
    - azure-devops
    - ado
    - dotnet
    - backend
    - api
    - devsecops
spec:
  owner: user:guest
  type: service

  parameters:

    - title: Component Details
      required:
        - name
        - description
      properties:
        name:
          title: Name
          type: string
          description: Unique name of the component
          ui:autofocus: true
        description:
          title: Description
          type: string
        ownerTeam:
          title: Owning Team / Distribution List
          type: string
          default: 'platform-engineering'
        costCenter:
          title: Cost Center
          type: string
          default: 'CC-100'

    - title: .NET Specifications
      required:
        - dotnetVersion
      properties:
        dotnetVersion:
          title: .NET Target Framework
          type: string
          enum: ['net6.0', 'net8.0']
          default: 'net8.0'
        testFramework:
          title: Unit Test Framework
          type: string
          enum: ['xUnit', 'NUnit', 'MSTest']
          default: 'xUnit'

    - title: Choose a location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - dev.azure.com

  steps:
    - id: fetch-base
      name: Fetch Base Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          repoUrl: ${{ parameters.repoUrl }}

    - id: publish
      name: Publish to Azure DevOps
      action: publish:azure
      input:
        description: This is ${{ parameters.name }}
        repoUrl: ${{ parameters.repoUrl }}

    - id: register
      name: Register in Backstage
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
