apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: ado-dev-app-onboarding
  title: Application Onboarding & Deployment
  description: "Developer Life Cycle: Onboard a new application and setup ADO deployment pipelines."
  tags:
    - azure-devops
    - ado
    - developer
    - onboarding
    - deployment
spec:
  owner: user:guest
  type: service

  parameters:

    - title: Application Onboarding
      required:
        - name
        - description
        - tier
        - oncallEmail
      properties:
        name:
          title: Application Name
          type: string
          ui:autofocus: true
        description:
          title: Description
          type: string
        tier:
          title: Application Tier (Critcality)
          type: string
          enum: ['Tier 1 (Mission Critical)', 'Tier 2 (Business Critical)', 'Tier 3 (Internal Tool)']
          default: 'Tier 2 (Business Critical)'
        oncallEmail:
          title: On-Call Distribution List / Email
          type: string
          format: email
    - title: Choose a location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - dev.azure.com

  steps:
    - id: fetch-base
      name: Fetch Base Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          repoUrl: ${{ parameters.repoUrl }}

    - id: publish
      name: Publish to Azure DevOps
      action: publish:azure
      input:
        description: This is ${{ parameters.name }}
        repoUrl: ${{ parameters.repoUrl }}

    - id: register
      name: Register in Backstage
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
