apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: Enterprise React App for ${{ values.project }}
  annotations:
    # 1. GitHub CI/CD & Actions
    github.com/project-slug: ${{ values.repoUrl | projectSlug }}
    
    # 2. Azure Cloud Hosting & Live Diagnostics
    azure.com/app-service-name: ${{ values.name }}
    azure.com/resource-group: 'devops-maf'
    
    # 3. Jira Agile Integration
    jira/project-key: 'SCRUM'
    
    # 4. Datadog Observability & Logs
    datadoghq.com/dashboard-url: 'https://p.datadoghq.com/sb/f2fdc87e-bdb2-11f1-880c-ce62a0ab8181-2feb325f332f971e08c696cf64e6f65c'
    datadoghq.com/graph-token: 'your_graph_token_here'
    
    # 5. TechDocs
    backstage.io/techdocs-ref: dir:.
spec:
  type: service
  lifecycle: production
  owner: platform-engineering

