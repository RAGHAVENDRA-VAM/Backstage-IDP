name: React CI Pipeline

on:
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  PROJECT_NAME: Simple_Insurance_portal
  ARTIFACT_NAME: Simple_Insurance_portal-drop

jobs:

  build:
    name: Build React Application
    runs-on: self-hosted

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Runner Node Version
        run: |
          echo "Required Node version: ${{ env.NODE_VERSION }}"
          echo "Runner Node version:"
          node --version
          echo "NPM version:"
          npm --version

      - name: Install Dependencies
        run: |
          npm ci

      - name: Build React Application
        run: |
          npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/


  publish:
    name: Publish Artifact
    runs-on: self-hosted
    needs: build

    steps:

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build/

      - name: Upload Final Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: build/
