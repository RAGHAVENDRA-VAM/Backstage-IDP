apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: container-enterprise-app
  title: Containerized Enterprise Application
  description: Create an enterprise application fully containerized with Docker and GitHub Actions.
  tags:
    - github
    - docker
    - container
    - devsecops
spec:
  owner: user:guest
  type: service

  parameters:

    - title: Component Details
      required:
        - name
        - description
      properties:
        name:
          title: Name
          type: string
          description: Unique name of the component
          ui:autofocus: true
        description:
          title: Description
          type: string
        ownerTeam:
          title: Owning Team / Distribution List
          type: string
          default: 'platform-engineering'
        costCenter:
          title: Cost Center
          type: string
          default: 'CC-100'

    - title: AI & LLM Configuration
      required:
        - llmProvider
      properties:
        llmProvider:
          title: Primary LLM Provider
          type: string
          enum: ['Azure OpenAI', 'OpenAI', 'Anthropic', 'Local/Ollama']
          default: 'Azure OpenAI'
        embeddingModel:
          title: Embedding Model (for RAG)
          type: string
          enum: ['text-embedding-ada-002', 'text-embedding-3-small', 'None']
          default: 'text-embedding-ada-002'
        vectorDb:
          title: Vector Database
          type: string
          enum: ['Pinecone', 'Qdrant', 'Milvus', 'Azure AI Search']
          default: 'Azure AI Search'

    - title: Choose a location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch-base
      name: Fetch Base Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          repoUrl: ${{ parameters.repoUrl }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        description: This is ${{ parameters.name }}
        repoUrl: ${{ parameters.repoUrl }}

    - id: register
      name: Register in Backstage
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
